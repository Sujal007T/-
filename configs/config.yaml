model:
  lora_alpha: 32
  lora_dropout: 0.05
  lora_r: 16
  name: Qwen/Qwen2.5-VL-3B-Instruct
  quantization_bits: 4
  target_modules:
  - q_proj
  - v_proj
paths:
  cache_dir: /content/drive/MyDrive/Project/disaSense_project/data/cache
  checkpoint_dir: /content/drive/MyDrive/Project/disaSense_project/checkpoints
  disasterm3_root: /content/drive/MyDrive/Project/disaSense_project/data/raw/disasterm3
  processed_dir: /content/drive/MyDrive/Project/disaSense_project/data/processed
  results_dir: /content/drive/MyDrive/Project/disaSense_project/results
  xbd_root: /content/drive/MyDrive/Project/disaSense_project/data/raw/xbd/train
project:
  name: disaSense_project
  seed: 42
training:
  fp16: true
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1e-4
  lr_scheduler: cosine
  max_seq_length: 1024
  num_train_epochs: 5
  per_device_train_batch_size: 1
  save_steps: 100
  warmup_steps: 50
xbd:
  damage_classes:
  - no-damage
  - minor-damage
  - major-damage
  - destroyed
  image_size: 224
